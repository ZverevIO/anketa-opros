
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <title>Переход к опросу</title>
</head>
<body>
  <p>Перенаправляем вас к опросу...</p>

  <script>
    var forms = [
      "https://forms.yandex.ru/u/6aa2258295add51d0135f0be/",    // Анкета (0) плацебо
      "https://forms.yandex.ru/u/6ad7389a90290233e446a7a9/",    // Анкета (1) нарратив - наличные сбережения
      "https://forms.yandex.ru/u/6ad738b99029022d4646a881/",    // Анкета (2) нарратив - кредитный рынок
      "https://forms.yandex.ru/u/6ad738cd2c4f89345c1bb1d0/",    // Анкета (3) нарратив - рынок труда
      "https://forms.yandex.ru/u/6ad738e590290231f846a895/"     // Анкета (4) нарратив - инфляция активов
    ];

    var group = Math.floor(Math.random() * forms.length);

    window.location.replace(forms[group]);
  </script>
</body>
